<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        background: #1e1e1e;
        color: #fff;
        width: 220px;
        position: relative;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 10px;
        font-weight: 600;
        text-align: center;
      }
      .toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #2a2a2a;
        padding: 8px 12px;
        border-radius: 10px;
        margin-bottom: 8px;
      }
      .toggle label {
        font-size: 13px;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 36px;
        height: 18px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #666;
        border-radius: 34px;
        transition: 0.3s;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 14px;
        width: 14px;
        left: 2px;
        bottom: 2px;
        background-color: white;
        border-radius: 50%;
        transition: 0.3s;
      }
      input:checked + .slider {
        background-color: #2196f3;
      }
      input:checked + .slider:before {
        transform: translateX(18px);
      }
      .speed-options {
        display: none;
        margin: 6px 0 10px 0;
        padding: 6px;
        background: #2a2a2a;
        border-radius: 8px;
        text-align: center;
      }
      .speed-btn {
        display: inline-block;
        margin: 4px;
        padding: 5px 10px;
        border-radius: 6px;
        background: #444;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.3s;
      }
      .speed-btn:hover {
        background: #666;
      }
      .speed-btn.active {
        background: #2196f3;
      }
      .version {
        text-align: center;
        font-size: 11px;
        color: #888;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <h2>YTB Controls</h2>

    <div class="toggle">
      <label>Toolbar</label>
      <label class="switch">
        <input type="checkbox" id="toggleToolbar" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle">
      <label>Dislike</label>
      <label class="switch">
        <input type="checkbox" id="toggleDislike" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle">
      <label>Snapshot</label>
      <label class="switch">
        <input type="checkbox" id="toggleSnapshot" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle">
      <label>Speed</label>
      <label class="switch">
        <input type="checkbox" id="toggleSpeed" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="version">V 1.3.0</div>

    <script src="popup.js"></script>
  </body>
</html>
